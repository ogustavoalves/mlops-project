name: MLOps CI Pipeline

on: 
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4
    
    - name: Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10.12"
        cache: "pip"

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install httpx pytest
        pip install -r requirements.txt

    - name: Rodar testes da API
      env:
        MLFLOW_TRACKING_URI: "http://localhost:5000"
      run: |
        # PYTHONPATH=. garante que o pytest entenda a estrutura de pastas
        PYTHONPATH=. pytest api/test_api.py -v

    - name: Validar Build do Docker
      run: |
        # Testa se o Dockerfile consegue ser construído sem erros de sintaxe ou de dependências
        docker compose build fastapi


services:
  mlflow:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - ./mlruns:/app/mlruns:z
      - ./mlflow-data:/app:z

  training-script:
    build: 
      context: .
      dockerfile: scripts/Dockerfile
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000 # variável de ambiente para conexão com o MLflow e registro dos modelos
    profiles: ['train']
    depends_on:
      mlflow:
        condition: service_healthy
        
  fastapi:
    build: 
      context:  .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    profiles: ['serve']
    depends_on:
      mlflow:
        condition: service_healthy
      training-script:
        condition: service_completed_successfully
        required: false
    volumes:
      - ./mlruns:/app/mlruns